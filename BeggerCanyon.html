function buildShip(Q){
 const A=[];let tris=0;const exh=[];
 const T=(a,b,c,m,col)=>{

  const cx=uy*vz-uz*vy,cy=uz*vx-ux*vz,cz=ux*vy-uy*vx;if(cx*cx+cy*cy+cz*cz<1e-10)return;

 if(!sel&&P)L.push('Z '+(P.z|0)+'  V '+P.v.toFixed(0)+'  X '+P.x.toFixed(1)+'  BUL '+G.bul.length+'  SPK '+G.spk.length+'  PIL '+tk.pil.length+'  PK '+tk.pk.filter(k=>!k.got).length);
 hx.font='11px ui-monospace,monospace';hx.textAlign='left';hx.textBaseline='top';let w=0;for(const l of L)w=Math.max(w,hx.measureText(l).width);hx.fillStyle='rgba(0,0,0,.55)';hx.fillRect(x-4,y-3,w+8,L.length*13+6);hx.fillStyle=DB.fps<30?'#ff5a3a':DB.fps<50?'#ffcf3a':'#7dffa8';L.forEach((l,i)=>{if(i===1)hx.fillStyle='#7dffa8';hx.fillText(l,x,y+i*13);});hx.restore();}
/* ================= input ================= */
const stage=$('stage');
const inCirc=(b,x,y)=>Math.hypot(x-b.x,y-b.y)<b.r*1.25;
function ptr(e,down){const x=e.clientX,y=e.clientY;
 if(G.state==='tap'||G.state==='select')return;
 if(down){if(Math.hypot(x-BTN.pause.x,y-BTN.pause.y)<28&&(G.state==='race'||G.state==='count')){touches.set(e.pointerId,'pause');return;}
  if(G.ctl===1){if(inCirc(BTN.left,x,y)){touches.set(e.pointerId,'left');G.bl=true;return;}if(inCirc(BTN.right,x,y)){touches.set(e.pointerId,'right');G.br=true;return;}}
  if(inCirc(BTN.fire,x,y)){touches.set(e.pointerId,'fire');G.fire=true;return;}
  if(inCirc(BTN.boost,x,y)){touches.set(e.pointerId,'boost');G.boost=true;return;}
  if(G.ctl===0&&x<W*.5&&padId<0){padId=e.pointerId;padO={x:clamp(x,H*.14,W*.45),y:clamp(y,H*.3,H*.9)};padK=x;touches.set(e.pointerId,'pad');G.steer=0;return;}}}
stage.addEventListener('pointerdown',e=>{if(G.state!=='race'&&G.state!=='count'&&G.state!=='finish')return;try{stage.setPointerCapture(e.pointerId);}catch(_){}ptr(e,true);});
stage.addEventListener('pointermove',e=>{if(e.pointerId===padId&&padO){G.steer=clamp((e.clientX-padO.x)/(H*.12),-1,1);}});
const rel=e=>{const k=touches.get(e.pointerId);if(k==='pause'){if(e.type==='pointerup'&&Math.hypot(e.clientX-BTN.pause.x,e.clientY-BTN.pause.y)<38){goFull();doPause();}}else if(k==='left')G.bl=false;else if(k==='right')G.br=false;else if(k==='fire')G.fire=false;else if(k==='boost')G.boost=false;else if(k==='pad'){padId=-1;padO=null;G.steer=0;}touches.delete(e.pointerId);};
stage.addEventListener('pointerup',rel);stage.addEventListener('pointercancel',rel);
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')G.keys.l=1;if(k==='ArrowRight'||k==='d'||k==='D')G.keys.r=1;if(k===' ')G.keys.space=1;if(k==='Shift'||k==='x'||k==='X')G.keys.shift=1;if(k==='p'||k==='P'||k==='Escape')doPause();if(['ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')G.keys.l=0;if(k==='ArrowRight'||k==='d'||k==='D')G.keys.r=0;if(k===' ')G.keys.space=0;if(k==='Shift'||k==='x'||k==='X')G.keys.shift=0;});
function kbSteer(){if(padId<0){G.steer+=(((G.keys.r||G.br)?1:0)-((G.keys.l||G.bl)?1:0)-G.steer)*.25;if(Math.abs(G.steer)<.01)G.steer=0;}}
/* ================= UI ================= */
function showOv(id){for(const k of['tap','menu','pause','res','shop'])$(k).style.display=(k===id?(k==='tap'||k==='pause'||k==='res'?'flex':'block'):'none');}
function refreshMenu(){if($('bTail')){const b=$('bTail');b.textContent='TAIL '+TAILC[G.tail][0];b.style.fontSize='.82em';}if($('mc'))$('mc').textContent='CREDITS '+G.cred;$('bLen').style.display='none';$('bBend').style.display='none';const s=getShip(G.shipIdx),n=SHIPLIST[G.shipIdx].name;$('sn').textContent=n+'  '+(G.shipIdx+1)+'/'+SHIPLIST.length;
 $('s1').style.width=s.pts[0]+'%';$('s2').style.width=s.pts[1]+'%';$('s3').style.width=s.pts[2]+'%';$('v1').textContent=s.pts[0];$('v2').textContent=s.pts[1];$('v3').textContent=s.pts[2];
 $('sd').textContent=s.SH.tris+' triangles - long and narrow ships are faster, narrow ones turn better, bulky ones take more hits.';$('bDiff').textContent=DIFFN[G.diff];$('bLen').textContent=LENN[G.len];$('bLv').textContent='LEVEL: '+LVN[G.lv];$('bBend').textContent='BENDS: '+['AUTO','GENTLE','MEDIUM','WINDING','BIG ONE','WILD'][G.bend];$('seed').value=G.seed;}
function toSelect(){G.state='select';showOv('menu');layout();refreshMenu();try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
function goFull(){try{const d=document.documentElement;const f=d.requestFullscreen||d.webkitRequestFullscreen;if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){const p=f.call(d,{navigationUI:'hide'});if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}}catch(e){}}
$('bTap').onclick=()=>{goFull();audioInit();if(AC&&AC.state==='suspended')AC.resume();toSelect();};
$('prev').onclick=()=>{G.shipIdx=(G.shipIdx+SHIPLIST.length-1)%SHIPLIST.length;saveS();refreshMenu();};
$('next').onclick=()=>{G.shipIdx=(G.shipIdx+1)%SHIPLIST.length;saveS();refreshMenu();};
$('bCol').onclick=()=>{G.pal=(G.pal+1)%COLS.length;saveS();};
$('bTail').onclick=()=>{G.tail=(G.tail+1)%8;saveS();refreshMenu();};
$('bDiff').onclick=()=>{G.diff=(G.diff+1)%3;saveS();refreshMenu();};
$('bLen').onclick=()=>{G.len=(G.len+1)%3;saveS();refreshMenu();};
$('bBend').onclick=()=>{G.bend=(G.bend+1)%6;saveS();refreshMenu();};
$('bLv').onclick=()=>{G.lv=(G.lv+1)%LVN.length;saveS();refreshMenu();};
$('bSeed').onclick=()=>{G.seed=1+Math.floor(Math.random()*99999);saveS();refreshMenu();};
$('seed').onchange=()=>{G.seed=clamp(parseInt($('seed').value)||1,1,99999);saveS();};
$('go').onclick=()=>{goFull();audioInit();if(AC&&AC.state==='suspended')AC.resume();G.seed=clamp(parseInt($('seed').value)||G.seed,1,99999);startRace(false);};
let paused=false;
function doPause(){if(G.state==='race'||G.state==='count'){try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}paused=true;G.prev=G.state;G.state='pause';showOv('pause');stopEngines();}else if(G.state==='pause')resume();}
function resume(){paused=false;G.state=G.prev||'race';showOv(null);}
$('bRes').onclick=()=>{goFull();resume();};$('bQuit').onclick=()=>{paused=false;toSelect();};
const ctlTxt=()=>$('bCtl').textContent='CONTROLS: '+(G.ctl?'BUTTONS':'STICK');ctlTxt();$('bCtl').onclick=()=>{G.ctl=1-G.ctl;G.steer=0;padId=-1;padO=null;ctlTxt();saveS();};
$('bUp').onclick=()=>{showOv('shop');shopRender();$('shmsg').textContent='';};$('bShopBack').onclick=()=>{showOv('menu');refreshMenu();};
$('bVoice').onclick=$('bVoice2').onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('rrvoice',voiceOn?'1':'0');}catch(e){}voiceTxt();if(!voiceOn)try{speechSynthesis.cancel();}catch(e){}};voiceTxt();
$('bMus').onclick=musCycle;$('bMus2').onclick=musCycle;musTxt();
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent='SOUND: '+(muted?'OFF':'ON');if(muted)stopEngines();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)doPause();});
function showResults(){if(G.state==='results')return;G.state='results';const P=G.racers[0];const fo=P.finOrd||G.racers.length,o=fo+(['TH','ST','ND','RD'][(fo%100>10&&fo%100<14)?0:fo%10<4?fo%10:0]);$('rt').textContent=o+' PLACE';
 $('rb').innerHTML='TIME '+P.finT.toFixed(1)+' s<br>SCORE '+Math.floor(P.score)+'<br>SHIP '+SHIPLIST[G.shipIdx].name+' / '+DIFFN[G.diff]+'<br>PRIZE +'+(G.prize||0)+'<br>CREDITS +'+G.credRace+' (TOTAL '+G.cred+')<br>LEVEL '+tk.lvname+'<br>TRACK '+G.seed;showOv('res');}
$('bCont').onclick=()=>{goFull();toSelect();};
/* ================= main loop ================= */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const rdt=(now-last)/1000,dt=Math.min(.05,rdt);last=now;DB.acc+=rdt;DB.fr++;DB.worst=Math.max(DB.worst*.98,rdt*1000);if(DB.acc>=.5){DB.fps=DB.fr/DB.acc;DB.ms=DB.acc/DB.fr*1000;DB.acc=0;DB.fr=0;}
 if(cvG.width<4)return;audioFrame(dt);
 if(G.state==='select'){renderSelect(now,dt);drawHUD();}
 else if(G.state==='tap'){gl.viewport(0,0,cvG.width,cvG.height);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);}
 else if(tk){if(G.state==='count'||G.state==='race'||G.state==='finish'){kbSteer();stepRace(dt);lockUpdate(dt);}if(G.state!=='results'||true)renderRace(now,dt);drawHUD();}
}
/* debug hooks */
window.RR={say,projScr,lockUpdate,upl,UPS,shopRender,MUSICENG,apPlan,apSteer,ENGL,SFXBUF,get AC(){return AC;},G,get tk(){return tk;},startRace,toSelect,SHIPLIST,getShip,genTrack,trackAt,stepRace,doPause};
layout();showOv('tap');requestAnimationFrame(frame);
if(location.search.indexOf('bot')>=0)G.auto=true;
</script></body></html>
